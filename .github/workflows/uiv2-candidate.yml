name: UIV2 candidate capture (temporary)

# TEMPORARY. This workflow exists only to capture the UIV2-26 cross-tab *candidate* for an
# owner review that needs a real browser; it never runs on the default branch. It commits the
# candidate manifest and a signature delta back to the branch, because artifacts and job logs
# are not reachable from the sandbox that asked for them. It is deleted before merge.

on:
  workflow_dispatch:
  # Dispatch alone is not enough while the file is new on a non-default branch: GitHub only
  # offers `workflow_dispatch` once the workflow is registered on the default branch. A push
  # trigger restricted to this one branch runs it from the branch itself.
  push:
    branches:
      - arena/f4336d9c-m5-agent-studio

permissions:
  contents: write

jobs:
  candidate:
    # The job pushes its own commit; without this guard that push would start it again.
    if: "!contains(github.event.head_commit.message, '[skip candidate]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
      - name: Install Python and locked browser dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "STUDIO_PYTHON=python"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: Capture the candidate
        run: |
          node scripts/uiux_v2_cross_tab_reference_walk.mjs \
            --candidate \
            --out "$RUNNER_TEMP/candidate" \
            --timeout-ms 60000
      - name: Validate the candidate
        run: python scripts/uiux_v2_cross_tab_reference.py --validate-candidate "$RUNNER_TEMP/candidate/candidate-manifest.json"
      - name: Publish the manifest and the signature delta on the branch
        run: |
          set -eu
          mkdir -p .uiv2-candidate
          cp "$RUNNER_TEMP/candidate/candidate-manifest.json" .uiv2-candidate/candidate-manifest.json
          python - <<'PY'
          import json, os, pathlib

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "candidate"
          cand = json.loads((root / "candidate-manifest.json").read_text())
          appr = json.loads(pathlib.Path("product/M5_2_0_UIUX_V2_Cross_Tab_Approval.json").read_text())
          before = {row["key"]: row["signature"] for row in appr["captures"]}

          def walk(a, b, path=""):
              if isinstance(a, dict) and isinstance(b, dict):
                  for key in sorted(set(a) | set(b)):
                      yield from walk(a.get(key), b.get(key), f"{path}.{key}" if path else key)
              elif isinstance(a, list) and isinstance(b, list) and len(a) == len(b):
                  for index, (left, right) in enumerate(zip(a, b)):
                      yield from walk(left, right, f"{path}[{index}]")
              elif a != b:
                  yield path, a, b

          report = {
              "captured_at_head": cand["git"]["head"],
              "dirty": cand["git"]["dirty"],
              "checks": cand["checks"],
              "browser": cand["browser"],
              "changed": {},
          }
          for row in cand["captures"]:
              delta = [
                  {"field": field, "approved": old, "candidate": new}
                  for field, old, new in walk(before.get(row["key"]), row["signature"])
              ]
              if delta:
                  report["changed"][row["key"]] = delta
          pathlib.Path(".uiv2-candidate/delta.json").write_text(json.dumps(report, indent=1, sort_keys=True) + "\n")
          print(json.dumps(report, indent=1, sort_keys=True))
          PY
          git config user.name "uiv2-candidate"
          git config user.email "uiv2-candidate@users.noreply.github.com"
          git add -f .uiv2-candidate
          git commit -q -m "chore(uiv2): publish the cross-tab candidate captured at ${GITHUB_SHA} [skip candidate]" -m "Temporary: the manifest and the structural delta against the approved baseline, committed where the sandbox that asked for them can read them (artifacts and job logs are unreachable from there). Deleted together with the capture workflow before merge."
          git push origin "HEAD:${GITHUB_REF_NAME}"
