name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read
  pull-requests: read

# Supersession is scoped per event lane, not per ref. Keying on `github.ref`
# alone made `refs/heads/X` and `refs/pull/N/merge` distinct groups, so a push
# and the pull request for the same commit ran side by side and neither ever
# superseded the other. Keying every event on the branch name instead would let
# a cheap scoped push run cancel an in-flight full-suite pull request run, which
# loses coverage; the lanes stay separate so only same-kind runs supersede.
# - push:            supersedes earlier pushes of the same branch, never `main`
# - pull_request:    supersedes the earlier run for the same PR branch
# - schedule/manual: unique per run, so a nightly is never cancelled
concurrency:
  group: ci-${{ format('{0}-{1}', github.event_name, (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  # A branch push and the pull request opened for it run the same commit twice.
  # The pull request run is the authoritative full-suite one (it is what branch
  # protection sees at merge time), so a branch push that already has an open
  # pull request skips the heavy jobs instead of paying for the same work twice.
  # Everything else still runs: `main` pushes, scheduled runs, manual runs, and
  # every pull request. Job-level `if:` reports the required checks as skipped,
  # which branch protection treats as passing; the check names never change.
  # Any failure of this probe returns `run=true`, so a broken token or API call
  # costs runner minutes rather than coverage.
  preflight:
    name: ci-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this run owns the work
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          run=true
          reason="event '$EVENT_NAME' always runs"
          if [ "$EVENT_NAME" = "push" ] && [ "$BRANCH" != "main" ]; then
            if open=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" --jq 'length' 2>&1); then
              if [ "$open" != "0" ]; then
                run=false
                reason="push to '$BRANCH' has $open open pull request(s); the pull request run owns this commit"
              else
                reason="push to '$BRANCH' has no open pull request"
              fi
            else
              reason="pull request lookup failed ($open); running to keep coverage"
            fi
          fi
          echo "::notice title=CI preflight::run=$run - $reason"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Worst measured leg is 13.6 min of work; the old 15 min ceiling left under
    # 10% headroom, so a slow pip resolve or runner hiccup killed a healthy run.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The pinned-baseline check verifies Git ancestry (BASELINE.md,
          # scripts/verify_baseline.py), so CI must fetch the full history.
          # The default depth-1 clone is exactly what broke the suite.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify pinned source baseline
        run: python scripts/verify_baseline.py
      - name: Check commit messages are documented
        run: python scripts/check_commit_messages.py --base origin/main
      - name: Check AS-031 sign-off record and release gate
        run: python scripts/validate_security_signoff.py
      - name: Validate published documentation and links
        run: python scripts/validate_docs.py
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Lint sources (Ruff)
        run: ruff check .
      - name: Type-check contract modules (mypy)
        run: mypy
      - name: Compile all tracked Python sources
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m compileall -q
      - name: Check frontend JavaScript syntax
        run: python scripts/check_frontend_syntax.py
      - name: Validate scoped test map
        run: python scripts/run_scoped_tests.py --check-map
      - name: Run tests
        # Pushes to feature branches run the affected mapped areas. Pull requests,
        # main pushes, scheduled runs, and manual runs retain the full suite.
        # Unknown or high-risk changes fall back to the full suite in the selector.
        # Failing tests are echoed as check annotations as well as logged, so a
        # red run names the test even when its job log is not reachable. The log
        # is also streamed while the suite runs: the previous version buffered
        # everything to a file and printed only the last 40 lines at the end, so
        # a 10-minute step showed nothing until it finished and a killed run
        # showed nothing at all. `tee` plus unbuffered Python keeps the file for
        # annotation, and --durations names the slow tests in the same log.
        env:
          SCOPE_ON_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
          SCOPE_BASE: ${{ github.event.before || '' }}
          SCOPE_HEAD: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=15 --durations-min=1.0"
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/pytest.log"
          started=$SECONDS
          if [ "$SCOPE_ON_PUSH" = "true" ]; then
            mode="scoped"
            python scripts/run_scoped_tests.py --base "$SCOPE_BASE" --head "$SCOPE_HEAD" 2>&1 | tee "$log"
          else
            mode="full"
            python -m pytest -q --tb=short -rf 2>&1 | tee "$log"
          fi
          status=${PIPESTATUS[0]}
          elapsed=$((SECONDS - started))
          summary=$(grep -E '[0-9]+ (passed|failed)' "$log" | tail -n 1)
          echo "::notice title=Pytest ${mode} suite (${elapsed}s, python ${{ matrix.python-version }})::${summary:-no summary line}"
          echo "Slowest tests (wall clock, seconds):"
          grep -E '^[0-9]+\.[0-9]+s (call|setup|teardown)' "$log" | head -n 20 || true
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' "$log" | head -25 | while IFS= read -r line; do
              echo "::error title=Pytest failure::${line}"
            done
          fi
          echo "--- pytest tail ---"
          tail -n 40 "$log"
          exit "$status"
      - name: Check the demo transcript and screenshot manifest
        run: |
          python scripts/demo_tour.py --check
          python scripts/validate_screenshots.py
      - name: Smoke-test local loopback startup and auth
        run: |
          python scripts/smoke_local.py
          python scripts/smoke_local.py --standalone
      - name: Build release evidence (SBOM, scans, provenance)
        run: >-
          python scripts/release_supply_chain.py build
          --output dist/evidence --deterministic --source-commit "$GITHUB_SHA"
      - name: Verify release evidence matches the artifact
        run: python scripts/release_supply_chain.py verify --output dist/evidence
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.python-version }}
          path: dist/evidence
          retention-days: 14
          if-no-files-found: error
      - name: Verify generated artifacts are reproducible
        run: |
          python scripts/build_studio.py
          python scripts/generate_route_matrix.py
          python scripts/generate_subsystem_inventory.py
          python scripts/generate_roadmap_status.py --check
          git diff --exit-code -- studio.py docs/route-security-matrix.md docs/subsystem-dependency-inventory.md

  browser-safety:
    name: Browser safety regressions
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Measured 7.7 min of work; the ceiling only guards against a hung browser.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
      - name: Install Python and locked browser dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "M5_REQUIRE_BROWSER_TESTS=1"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: Run UIV2-29 backend authorization, recovery, ledger, fencing and isolation gate
        run: |
          python scripts/uiv2_performance_safety.py --run-backend \
            --backend-output "${RUNNER_TEMP:-/tmp}/uiv2-29-backend-safety.json"
      - name: Run browser-backed screenshot, keyboard and adversarial refusal regressions
        # Failing tests are echoed as check annotations, as the test job does: this job
        # has no other readable output when its log is not reachable from where it is
        # being triaged, and a red browser run that names no test is a dead end.
        run: |
          set +e
          python -m pytest -q -p scripts.browser_ci_no_skips tests/test_screenshot_capture_browser.py tests/test_uiux_adversarial_browser.py --tb=short > "${RUNNER_TEMP:-/tmp}/browser.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' "${RUNNER_TEMP:-/tmp}/browser.log" | head -25 | while IFS= read -r line; do
              echo "::error title=Browser regression::${line}"
            done
          fi
          tail -n 60 "${RUNNER_TEMP:-/tmp}/browser.log"
          exit "$status"
      - name: Run approved cross-tab visual structure gate
        run: |
          node scripts/uiux_v2_cross_tab_reference_walk.mjs \
            --check \
            --out "${RUNNER_TEMP:-/tmp}/cross-tab-reference-uiv2-26" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
      - name: Run UIV2-28 keyboard, responsive and accessibility adversarial gates
        run: |
          node scripts/a11y_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-keyboard"
          node scripts/responsive_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-responsive"
          node scripts/uiv2_accessibility_adversarial_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-accessibility" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
      - name: Run UIV2-29 stream performance, bounded memory and layout gates
        run: |
          node scripts/stream_perf_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-29-stream-legacy"
          node scripts/uiv2_performance_safety_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-29-performance" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
