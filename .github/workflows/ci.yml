name: CI

on:
  push:
    # A branch with an open PR is verified by pull_request below; the planner
    # leaves the push run as a cheap compatibility-check placeholder.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read
  pull-requests: read

# Supersession stays inside an event lane: a delegated push must never cancel
# the pull request's full gate. Feature pushes and successive commits on one PR
# cancel their own predecessors; main, scheduled, and manual runs never do.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.run_id)) ||
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      format('{0}-{1}', github.event_name, github.ref_name)
    }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: Select verification plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_verification: ${{ steps.plan.outputs.run_verification }}
      suite: ${{ steps.plan.outputs.suite }}
      scope_base: ${{ steps.plan.outputs.scope_base }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect an open pull request for a feature push
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          count=-1
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            if result=$(gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open -f "head=$REPOSITORY_OWNER:$REF_NAME" -f per_page=100 \
              --jq 'length'); then
              count="$result"
            else
              echo "::warning title=Pull-request lookup failed::Running the scoped push gate instead of suppressing verification."
            fi
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Select fail-closed verification work
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          python scripts/ci_execution_plan.py \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --before "$BEFORE_SHA" \
            --open-pr-count "${{ steps.open-pr.outputs.count }}" \
            --github-output "$GITHUB_OUTPUT"

  test:
    # Required full-gate identities still render as test (3.11), test (3.12),
    # and test (3.13). A delegated feature push uses a non-required prefix, so
    # its cheap placeholder cannot satisfy or obscure the pull request gate.
    name: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && 'Branch test' || 'test' }} (${{ matrix.python-version }})
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    # Preserve headroom for a cold dependency resolve or a slower hosted runner;
    # measured latency is reported by the test step rather than hidden by this ceiling.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Refuse an invalid verification plan
        if: needs.plan.result != 'success'
        run: |
          echo "Verification plan did not complete successfully."
          exit 1
      - name: Delegate duplicate feature-push work to the pull request gate
        if: needs.plan.result == 'success' && needs.plan.outputs.run_verification != 'true'
        run: echo "${{ needs.plan.outputs.reason }}"
      - uses: actions/checkout@v7
        if: needs.plan.outputs.run_verification == 'true'
        with:
          # The pinned-baseline check verifies Git ancestry (BASELINE.md,
          # scripts/verify_baseline.py), so CI must fetch the full history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: needs.plan.outputs.run_verification == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        if: needs.plan.outputs.run_verification == 'true'
        with:
          node-version: 22
      - name: Install project and test dependencies
        if: needs.plan.outputs.run_verification == 'true'
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Verify pinned source baseline
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/verify_baseline.py
      - name: Check commit messages are documented
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/check_commit_messages.py --base origin/main
      - name: Check AS-031 sign-off record and release gate
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/validate_security_signoff.py
      - name: Validate published documentation and links
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/validate_docs.py
      - name: Lint sources (Ruff)
        if: needs.plan.outputs.run_verification == 'true'
        run: ruff check .
      - name: Type-check contract modules (mypy)
        if: needs.plan.outputs.run_verification == 'true'
        run: mypy
      - name: Compile all tracked Python sources
        if: needs.plan.outputs.run_verification == 'true'
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m compileall -q
      - name: Check frontend JavaScript syntax
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/check_frontend_syntax.py
      - name: Validate scoped test map
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/run_scoped_tests.py --check-map
      - name: Run tests
        if: needs.plan.outputs.run_verification == 'true'
        env:
          SELECTED_SUITE: ${{ needs.plan.outputs.suite }}
          SCOPE_BASE: ${{ needs.plan.outputs.scope_base }}
          SCOPE_HEAD: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=15 --durations-min=1.0"
        # Stream progress while retaining a log for annotations and measured
        # timing. Disabling errexit is deliberate: diagnostics must still run
        # after a failing pytest pipeline.
        run: |
          set +e
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/pytest.log"
          started=$SECONDS
          if [ "$SELECTED_SUITE" = "scoped" ]; then
            mode="scoped"
            python scripts/run_scoped_tests.py --base "$SCOPE_BASE" --head "$SCOPE_HEAD" 2>&1 | tee "$log"
          else
            mode="full"
            python -m pytest -q --tb=short -rf 2>&1 | tee "$log"
          fi
          status=${PIPESTATUS[0]}
          elapsed=$((SECONDS - started))
          summary=$(grep -E '[0-9]+ (passed|failed)' "$log" | tail -n 1)
          echo "::notice title=Pytest ${mode} suite - ${elapsed}s - Python ${{ matrix.python-version }}::${summary:-no summary line}"
          echo "Slowest tests (wall clock, seconds):"
          grep -E '^[0-9]+\.[0-9]+s (call|setup|teardown)' "$log" | head -n 20 || true
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' "$log" | head -25 | while IFS= read -r line; do
              echo "::error title=Pytest failure::${line}"
            done
          fi
          echo "--- pytest tail ---"
          tail -n 40 "$log"
          exit "$status"
      - name: Check the demo transcript and screenshot manifest
        if: needs.plan.outputs.run_verification == 'true'
        run: |
          python scripts/demo_tour.py --check
          python scripts/validate_screenshots.py
      - name: Smoke-test local loopback startup and auth
        if: needs.plan.outputs.run_verification == 'true'
        run: |
          python scripts/smoke_local.py
          python scripts/smoke_local.py --standalone
      - name: Build release evidence (SBOM, scans, provenance)
        if: needs.plan.outputs.run_verification == 'true'
        run: >-
          python scripts/release_supply_chain.py build
          --output dist/evidence --deterministic --source-commit "$GITHUB_SHA"
      - name: Verify release evidence matches the artifact
        if: needs.plan.outputs.run_verification == 'true'
        run: python scripts/release_supply_chain.py verify --output dist/evidence
      - name: Upload release evidence
        if: needs.plan.outputs.run_verification == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.python-version }}
          path: dist/evidence
          retention-days: 14
          if-no-files-found: error
      - name: Verify generated artifacts are reproducible
        if: needs.plan.outputs.run_verification == 'true'
        run: |
          python scripts/build_studio.py
          python scripts/generate_route_matrix.py
          python scripts/generate_subsystem_inventory.py
          python scripts/generate_roadmap_status.py --check
          git diff --exit-code -- studio.py docs/route-security-matrix.md docs/subsystem-dependency-inventory.md

  browser_safety_shards:
    name: Browser safety shard (${{ matrix.shard }})
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.run_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [backend, regressions, visual, accessibility, performance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        if: matrix.shard != 'backend'
        with:
          node-version: "22.22.3"
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install locked browser dependencies
        if: matrix.shard != 'backend'
        run: npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        if: matrix.shard != 'backend'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "M5_REQUIRE_BROWSER_TESTS=1"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: Run UIV2-29 backend authorization, recovery, ledger, fencing and isolation gate
        if: matrix.shard == 'backend'
        run: |
          python scripts/uiv2_performance_safety.py --run-backend \
            --backend-output "${RUNNER_TEMP:-/tmp}/uiv2-29-backend-safety.json"
      - name: Run browser-backed screenshot, keyboard and adversarial refusal regressions
        if: matrix.shard == 'regressions'
        # Failing tests are echoed as check annotations, as the test job does.
        run: |
          set +e
          python -m pytest -q -p scripts.browser_ci_no_skips tests/test_screenshot_capture_browser.py tests/test_uiux_adversarial_browser.py --tb=short > "${RUNNER_TEMP:-/tmp}/browser.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' "${RUNNER_TEMP:-/tmp}/browser.log" | head -25 | while IFS= read -r line; do
              echo "::error title=Browser regression::${line}"
            done
          fi
          tail -n 60 "${RUNNER_TEMP:-/tmp}/browser.log"
          exit "$status"
      - name: Run approved cross-tab visual structure gate
        if: matrix.shard == 'visual'
        run: |
          node scripts/uiux_v2_cross_tab_reference_walk.mjs \
            --check \
            --out "${RUNNER_TEMP:-/tmp}/cross-tab-reference-uiv2-26" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
      - name: Run UIV2-28 keyboard, responsive and accessibility adversarial gates
        if: matrix.shard == 'accessibility'
        run: |
          node scripts/a11y_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-keyboard"
          node scripts/responsive_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-responsive"
          node scripts/uiv2_accessibility_adversarial_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-accessibility" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
      - name: Run UIV2-29 stream performance, bounded memory and layout gates
        if: matrix.shard == 'performance'
        run: |
          node scripts/stream_perf_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-29-stream-legacy"
          node scripts/uiv2_performance_safety_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-29-performance" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python

  browser_safety:
    # Full events retain the required Browser safety regressions identity. The
    # delegated feature-push placeholder is deliberately non-required.
    name: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && 'Branch browser safety regressions' || 'Browser safety regressions' }}
    needs: [plan, browser_safety_shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every selected browser safety shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_VERIFICATION: ${{ needs.plan.outputs.run_verification }}
          SHARD_RESULT: ${{ needs.browser_safety_shards.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Verification plan did not complete successfully."
            exit 1
          fi
          if [ "$RUN_VERIFICATION" != "true" ]; then
            echo "${{ needs.plan.outputs.reason }}"
            exit 0
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more browser safety shards did not pass: $SHARD_RESULT"
            exit 1
          fi
          echo "Every browser safety shard passed."
