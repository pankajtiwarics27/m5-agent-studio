name: CI

on:
  push:
    # A branch with an open PR is verified by pull_request below; the planner
    # leaves the push run as a cheap compatibility-check placeholder.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      python_mode:
        description: Run job shards or capture an unsharded same-commit outcome baseline
        required: true
        default: sharded
        type: choice
        options:
          - sharded
          - unsharded_baseline
      baseline_run_id:
        description: Same-commit unsharded workflow run to compare with sharded outcomes
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 7 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

# Supersession stays inside an event lane: a delegated push must never cancel
# the pull request's full gate. Feature pushes and successive commits on one PR
# cancel their own predecessors; main, scheduled, and manual runs never do.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.run_id)) ||
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      format('{0}-{1}', github.event_name, github.ref_name)
    }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: Select verification plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_verification: ${{ steps.plan.outputs.run_verification }}
      suite: ${{ steps.plan.outputs.suite }}
      scope_base: ${{ steps.plan.outputs.scope_base }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect an open pull request for a feature push
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          count=-1
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            if result=$(gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open -f "head=$REPOSITORY_OWNER:$REF_NAME" -f per_page=100 \
              --jq 'length'); then
              count="$result"
            else
              echo "::warning title=Pull-request lookup failed::Running the full push gate because no pull request can be trusted to own coverage."
            fi
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Select fail-closed verification work
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          python scripts/ci_execution_plan.py \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --before "$BEFORE_SHA" \
            --open-pr-count "${{ steps.open-pr.outputs.count }}" \
            --github-output "$GITHUB_OUTPUT"

  source_gates:
    name: Source and release-independent gates
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.run_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install source-gate dependencies
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Verify pinned source baseline
        run: python scripts/verify_baseline.py
      - name: Check commit messages are documented
        run: python scripts/check_commit_messages.py --base origin/main
      - name: Check AS-031 sign-off record and release gate
        run: python scripts/validate_security_signoff.py
      - name: Validate published documentation and links
        run: python scripts/validate_docs.py
      - name: Lint sources (Ruff)
        run: ruff check .
      - name: Type-check contract modules (mypy)
        run: mypy
      - name: Compile all tracked Python sources
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m compileall -q
      - name: Check frontend JavaScript syntax
        run: python scripts/check_frontend_syntax.py
      - name: Validate scoped test and CI shard maps
        run: |
          python scripts/run_scoped_tests.py --check-map
          python scripts/ci_test_shard.py --validate
      - name: Check the demo transcript and screenshot manifest
        run: |
          python scripts/demo_tour.py --check
          python scripts/validate_screenshots.py
      - name: Smoke-test local loopback startup and auth
        run: |
          python scripts/smoke_local.py
          python scripts/smoke_local.py --standalone
      - name: Verify generated artifacts are reproducible
        run: |
          python scripts/build_studio.py
          python scripts/generate_route_matrix.py
          python scripts/generate_subsystem_inventory.py
          python scripts/generate_roadmap_status.py --check
          git diff --exit-code -- studio.py docs/route-security-matrix.md docs/subsystem-dependency-inventory.md

  python_test_shards:
    name: Python test shard (${{ matrix.python-version }}, ${{ matrix.shard }})
    needs: plan
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_verification == 'true' &&
      needs.plan.outputs.suite == 'full' &&
      (github.event_name != 'workflow_dispatch' || inputs.python_mode != 'unsharded_baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install identical test dependencies
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Run deterministic pytest shard
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=15 --durations-min=1.0"
        run: >-
          python scripts/ci_test_shard.py
          --run-shard "${{ matrix.shard }}"
          --python-version "${{ matrix.python-version }}"
          --output "${RUNNER_TEMP}/pytest-result-${{ matrix.python-version }}-${{ matrix.shard }}.json"
      - name: Upload pytest outcome evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-result-${{ matrix.python-version }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-result-${{ matrix.python-version }}-${{ matrix.shard }}.*
          retention-days: 14
          if-no-files-found: error
      - name: Build release evidence once per interpreter
        if: success() && matrix.shard == '1'
        run: >-
          python scripts/release_supply_chain.py build
          --output dist/evidence --deterministic --source-commit "$GITHUB_SHA"
      - name: Verify release evidence once per interpreter
        if: success() && matrix.shard == '1'
        run: python scripts/release_supply_chain.py verify --output dist/evidence
      - name: Upload release evidence once per interpreter
        if: success() && matrix.shard == '1'
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.python-version }}
          path: dist/evidence
          retention-days: 14
          if-no-files-found: error

  python_identity:
    name: Python shard identity (${{ matrix.python-version }})
    needs: [plan, python_test_shards]
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_verification == 'true' &&
      needs.plan.outputs.suite == 'full' &&
      needs.python_test_shards.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.python_mode != 'unsharded_baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install identical test dependencies
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Download this interpreter's shard outcomes
        uses: actions/download-artifact@v7
        with:
          pattern: pytest-result-${{ matrix.python-version }}-*
          path: ${{ runner.temp }}/pytest-results
          merge-multiple: true
      - name: Prove node-set and outcome-union identity
        run: >-
          python scripts/ci_test_shard.py
          --verify-results "${RUNNER_TEMP}/pytest-results"
          --python-version "${{ matrix.python-version }}"
          --source-sha "$GITHUB_SHA"
          --output "${RUNNER_TEMP}/pytest-union-${{ matrix.python-version }}.json"
      - name: Download same-commit unsharded baseline
        if: inputs.baseline_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: >-
          gh run download "$BASELINE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "pytest-baseline-${{ matrix.python-version }}"
          --dir "${RUNNER_TEMP}/pytest-baseline"
      - name: Refuse a baseline from another commit
        if: inputs.baseline_run_id != ''
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["PYTHON_VERSION"]
          path = Path(os.environ["RUNNER_TEMP"]) / "pytest-baseline" / f"pytest-baseline-{version}.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("source_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit(f"baseline belongs to {payload.get('source_sha')}, expected {os.environ['GITHUB_SHA']}")
          print(f"same-commit baseline confirmed: {payload['source_sha']}")
          PY
      - name: Compare every outcome and skip with the unsharded baseline
        if: inputs.baseline_run_id != ''
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python scripts/verify_test_identity.py \
            --version "$PYTHON_VERSION" \
            --baseline-collect "${RUNNER_TEMP}/pytest-baseline/pytest-baseline-${PYTHON_VERSION}.collect.txt" \
            --baseline-junit "${RUNNER_TEMP}/pytest-baseline/pytest-baseline-${PYTHON_VERSION}.xml" \
            --phase "shard-1:${RUNNER_TEMP}/pytest-results/pytest-result-${PYTHON_VERSION}-1.collect.txt:${RUNNER_TEMP}/pytest-results/pytest-result-${PYTHON_VERSION}-1.xml" \
            --phase "shard-2:${RUNNER_TEMP}/pytest-results/pytest-result-${PYTHON_VERSION}-2.collect.txt:${RUNNER_TEMP}/pytest-results/pytest-result-${PYTHON_VERSION}-2.xml" \
            --phase "shard-3:${RUNNER_TEMP}/pytest-results/pytest-result-${PYTHON_VERSION}-3.collect.txt:${RUNNER_TEMP}/pytest-results/pytest-result-${PYTHON_VERSION}-3.xml"
          echo "::notice title=Pytest baseline identity - Python ${PYTHON_VERSION}::same-commit node IDs, outcomes, and skip reasons are identical"
      - name: Upload sharded union evidence
        uses: actions/upload-artifact@v7
        with:
          name: pytest-union-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-union-${{ matrix.python-version }}.json
          retention-days: 14
          if-no-files-found: error

  python_unsharded_baseline:
    name: Python unsharded baseline (${{ matrix.python-version }})
    needs: plan
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_verification == 'true' &&
      needs.plan.outputs.suite == 'full' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.python_mode == 'unsharded_baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install identical test dependencies
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Run unsharded outcome baseline
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=15 --durations-min=1.0"
        run: >-
          python scripts/ci_test_shard.py
          --run-baseline
          --python-version "${{ matrix.python-version }}"
          --output "${RUNNER_TEMP}/pytest-baseline-${{ matrix.python-version }}.json"
      - name: Upload unsharded outcome evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-baseline-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-baseline-${{ matrix.python-version }}.*
          retention-days: 14
          if-no-files-found: error
      - name: Build release evidence
        if: success()
        run: >-
          python scripts/release_supply_chain.py build
          --output dist/evidence --deterministic --source-commit "$GITHUB_SHA"
      - name: Verify release evidence
        if: success()
        run: python scripts/release_supply_chain.py verify --output dist/evidence
      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.python-version }}
          path: dist/evidence
          retention-days: 14
          if-no-files-found: error

  python_scoped:
    name: Python scoped test (${{ matrix.python-version }})
    needs: plan
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_verification == 'true' &&
      needs.plan.outputs.suite == 'scoped'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install identical test dependencies
        run: python -m pip install -e '.[dev,supply-chain]'
      - name: Run scoped tests
        env:
          SCOPE_BASE: ${{ needs.plan.outputs.scope_base }}
          SCOPE_HEAD: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=15 --durations-min=1.0"
        run: |
          set +e
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/pytest.log"
          started=$SECONDS
          python scripts/run_scoped_tests.py --base "$SCOPE_BASE" --head "$SCOPE_HEAD" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          elapsed=$((SECONDS - started))
          summary=$(grep -E '[0-9]+ (passed|failed)' "$log" | tail -n 1)
          echo "::notice title=Pytest scoped suite - ${elapsed}s - Python ${{ matrix.python-version }}::${summary:-no summary line}"
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' "$log" | head -25 | while IFS= read -r line; do
              echo "::error title=Pytest failure::${line}"
            done
          fi
          tail -n 40 "$log"
          exit "$status"
      - name: Build release evidence
        if: success()
        run: >-
          python scripts/release_supply_chain.py build
          --output dist/evidence --deterministic --source-commit "$GITHUB_SHA"
      - name: Verify release evidence
        if: success()
        run: python scripts/release_supply_chain.py verify --output dist/evidence
      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.python-version }}
          path: dist/evidence
          retention-days: 14
          if-no-files-found: error

  test:
    name: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && 'Branch test' || 'test' }} (${{ matrix.python-version }})
    needs: [plan, source_gates, python_test_shards, python_identity, python_unsharded_baseline, python_scoped]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Require every selected Python gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_VERIFICATION: ${{ needs.plan.outputs.run_verification }}
          SUITE: ${{ needs.plan.outputs.suite }}
          REASON: ${{ needs.plan.outputs.reason }}
          SOURCE_RESULT: ${{ needs.source_gates.result }}
          SHARD_RESULT: ${{ needs.python_test_shards.result }}
          IDENTITY_RESULT: ${{ needs.python_identity.result }}
          BASELINE_RESULT: ${{ needs.python_unsharded_baseline.result }}
          SCOPED_RESULT: ${{ needs.python_scoped.result }}
          PYTHON_MODE: ${{ inputs.python_mode || 'sharded' }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Verification plan did not complete successfully."
            exit 1
          fi
          if [ "$RUN_VERIFICATION" != "true" ]; then
            echo "$REASON"
            exit 0
          fi
          if [ "$SOURCE_RESULT" != "success" ]; then
            echo "Source gates did not pass: $SOURCE_RESULT"
            exit 1
          fi
          if [ "$SUITE" = "scoped" ]; then
            [ "$SCOPED_RESULT" = "success" ] || { echo "Scoped tests did not pass: $SCOPED_RESULT"; exit 1; }
          elif [ "$PYTHON_MODE" = "unsharded_baseline" ]; then
            [ "$BASELINE_RESULT" = "success" ] || { echo "Unsharded baseline did not pass: $BASELINE_RESULT"; exit 1; }
          else
            [ "$SHARD_RESULT" = "success" ] || { echo "Python shards did not pass: $SHARD_RESULT"; exit 1; }
            [ "$IDENTITY_RESULT" = "success" ] || { echo "Python identity checks did not pass: $IDENTITY_RESULT"; exit 1; }
          fi
          echo "Every selected Python gate passed for ${{ matrix.python-version }}."

  browser_safety_shards:
    name: Browser safety shard (${{ matrix.shard }})
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.run_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [backend, regressions, visual, accessibility, performance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        if: matrix.shard != 'backend'
        with:
          node-version: "22.22.3"
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install locked browser dependencies
        if: matrix.shard != 'backend'
        run: npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        if: matrix.shard != 'backend'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "M5_REQUIRE_BROWSER_TESTS=1"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: Run UIV2-29 backend authorization, recovery, ledger, fencing and isolation gate
        if: matrix.shard == 'backend'
        run: |
          python scripts/uiv2_performance_safety.py --run-backend \
            --backend-output "${RUNNER_TEMP:-/tmp}/uiv2-29-backend-safety.json"
      - name: Run browser-backed screenshot, keyboard and adversarial refusal regressions
        if: matrix.shard == 'regressions'
        # Failing tests are echoed as check annotations, as the test job does.
        run: |
          set +e
          python -m pytest -q -p scripts.browser_ci_no_skips tests/test_screenshot_capture_browser.py tests/test_uiux_adversarial_browser.py --tb=short > "${RUNNER_TEMP:-/tmp}/browser.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' "${RUNNER_TEMP:-/tmp}/browser.log" | head -25 | while IFS= read -r line; do
              echo "::error title=Browser regression::${line}"
            done
          fi
          tail -n 60 "${RUNNER_TEMP:-/tmp}/browser.log"
          exit "$status"
      - name: Run approved cross-tab visual structure gate
        if: matrix.shard == 'visual'
        run: |
          node scripts/uiux_v2_cross_tab_reference_walk.mjs \
            --check \
            --out "${RUNNER_TEMP:-/tmp}/cross-tab-reference-uiv2-26" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
      - name: Run UIV2-28 keyboard, responsive and accessibility adversarial gates
        if: matrix.shard == 'accessibility'
        run: |
          node scripts/a11y_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-keyboard"
          node scripts/responsive_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-responsive"
          node scripts/uiv2_accessibility_adversarial_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-28-accessibility" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python
      - name: Run UIV2-29 stream performance, bounded memory and layout gates
        if: matrix.shard == 'performance'
        run: |
          node scripts/stream_perf_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-29-stream-legacy"
          node scripts/uiv2_performance_safety_walk.mjs \
            --screenshots "${RUNNER_TEMP:-/tmp}/uiv2-29-performance" \
            --timeout-ms 60000
        env:
          STUDIO_PYTHON: python

  browser_safety:
    # Full events retain the required Browser safety regressions identity. The
    # delegated feature-push placeholder is deliberately non-required.
    name: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && 'Branch browser safety regressions' || 'Browser safety regressions' }}
    needs: [plan, browser_safety_shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every selected browser safety shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_VERIFICATION: ${{ needs.plan.outputs.run_verification }}
          SHARD_RESULT: ${{ needs.browser_safety_shards.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Verification plan did not complete successfully."
            exit 1
          fi
          if [ "$RUN_VERIFICATION" != "true" ]; then
            echo "${{ needs.plan.outputs.reason }}"
            exit 0
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more browser safety shards did not pass: $SHARD_RESULT"
            exit 1
          fi
          echo "Every browser safety shard passed."
