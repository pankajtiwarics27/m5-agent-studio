name: UIV2 evidence refresh (temporary)

# TEMPORARY. The phone Hall fix changes static/index.html, so the two source-bound browser run
# records (UIV2-28 accessibility, UIV2-29 performance/safety) no longer match the checkout they are
# committed in, and this container cannot render in Chromium. This dispatch/push-only job re-runs
# both walks for real, imports their manifests, regenerates the inventory artifacts that hash the
# same sources, and commits the result to the branch. Deleted before merge.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f4336d9c-m5-agent-studio

permissions:
  contents: write

jobs:
  refresh:
    if: "!startsWith(github.event.head_commit.message, 'chore(uiv2): refresh')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
      - name: Install Python and locked browser dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "STUDIO_PYTHON=python"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: UIV2-29 browser walk (real SSE, DOM/heap, layout)
        run: node scripts/uiv2_performance_safety_walk.mjs --screenshots "$RUNNER_TEMP/uiv2-29"
      - name: UIV2-29 import, backend run and regenerate
        run: |
          python scripts/uiv2_performance_safety.py --import-evidence "$RUNNER_TEMP/uiv2-29/capture-manifest.json"
          python scripts/uiv2_performance_safety.py --run-backend
          python scripts/uiv2_performance_safety.py
          python scripts/uiv2_performance_safety.py --check
      - name: UIV2-28 browser walk (keyboard, responsive, adversarial)
        run: node scripts/uiv2_accessibility_adversarial_walk.mjs --screenshots "$RUNNER_TEMP/uiv2-28"
      - name: UIV2-28 import and regenerate
        run: |
          python scripts/uiv2_accessibility_adversarial.py --import-evidence "$RUNNER_TEMP/uiv2-28/capture-manifest.json"
          python scripts/uiv2_accessibility_adversarial.py
          python scripts/uiv2_accessibility_adversarial.py --check
      - name: Regenerate the inventories that hash the same sources
        run: |
          python scripts/uiux_start_command_center_inventory.py
          python scripts/uiux_pipeline_workspace_inventory.py
          python scripts/uiux_responsive_inventory.py
      - name: Regenerate the release gate from those artifacts
        run: python scripts/uiux_release_gate.py
      - name: Commit the refreshed records
        run: |
          set -eu
          git config user.name "uiv2-refresh"
          git config user.email "uiv2-refresh@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing refreshed"
            exit 0
          fi
          git commit -q -m "chore(uiv2): refresh the source-bound browser records for the phone Hall fix" -m "UIV2-28 and UIV2-29 were re-run for real against this checkout (the previous records were bound to the pre-fix static/index.html), and the inventories and release gate that hash the same sources were regenerated from them. Produced in CI by the pinned Chromium 153 build; this workflow is deleted before merge."
          git push origin "HEAD:${GITHUB_REF_NAME}"
