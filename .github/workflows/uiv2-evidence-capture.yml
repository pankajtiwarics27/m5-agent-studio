name: UIV2 evidence capture (temporary)

# TEMPORARY. The UIV2-30 release-evidence import needs two browser walks, and this container cannot
# render in Chromium. This push-only job runs them on the pinned build and commits their small JSON
# outputs to the branch, where the evidence import can read them. Deleted before merge, together
# with the JSON files it publishes.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f4336d9c-m5-agent-studio

permissions:
  contents: write

jobs:
  capture:
    if: "!startsWith(github.event.head_commit.message, 'chore(uiv2): publish the release-evidence inputs')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
      - name: Install Python and locked browser dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "STUDIO_PYTHON=python"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: Compare continuity walk
        run: |
          node scripts/compare_continuity_walk.mjs --screenshots "$RUNNER_TEMP/compare" --json > "$RUNNER_TEMP/compare.json"
          mkdir -p .uiv2-evidence
          cp "$RUNNER_TEMP/compare.json" .uiv2-evidence/compare.json
          python -c "import json,os;d=json.load(open('.uiv2-evidence/compare.json'));print('compare:', d.get('totals') or d.get('checks'))"
      - name: Approved cross-tab structure walk
        run: |
          node scripts/uiux_v2_cross_tab_reference_walk.mjs \
            --check \
            --out "$RUNNER_TEMP/visual" \
            --timeout-ms 60000
          cp "$RUNNER_TEMP/visual/check-manifest.json" .uiv2-evidence/check-manifest.json
      - name: Publish the evidence inputs on the branch
        run: |
          set -eu
          git config user.name "uiv2-evidence"
          git config user.email "uiv2-evidence@users.noreply.github.com"
          git add -f .uiv2-evidence
          git commit -q -m "chore(uiv2): publish the release-evidence inputs captured at ${GITHUB_SHA}" -m "Compare continuity and cross-tab check manifests from real runs on the pinned Chromium 153 build, committed where the sandbox that drives this branch can read them (artifacts and logs are unreachable from there). Deleted before merge."
          git push origin "HEAD:${GITHUB_REF_NAME}"
