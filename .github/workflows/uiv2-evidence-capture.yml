name: UIV2 evidence capture (temporary)

# TEMPORARY. The UIV2-30 release-evidence import needs two browser walks, and this checkout cannot
# render in Chromium. This push-only job runs them on the pinned build and commits their small JSON
# outputs (and, if a walk fails, its stderr) to the branch, where they can be read. Deleted before
# merge, together with the files it publishes.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f4336d9c-m5-agent-studio

permissions:
  contents: write

jobs:
  capture:
    if: "!startsWith(github.event.head_commit.message, 'chore(uiv2): publish the release-evidence inputs') && !startsWith(github.event.head_commit.message, 'chore(uiv2): publish the evidence capture')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
      - name: Install Python and locked browser dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix tests/browser --ignore-scripts
      - name: Prepare pinned Chromium and its libraries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m5-browser/tmp" "$RUNNER_TEMP/m5-browser/libs"
          export TMPDIR="$RUNNER_TEMP/m5-browser/tmp"
          chrome=$(node --input-type=module -e 'import chromium from "./tests/browser/node_modules/@sparticuz/chromium/build/index.js"; console.log(await chromium.executablePath())')
          node -e 'const z=require("node:zlib"),f=require("node:fs"); f.createReadStream("tests/browser/node_modules/@sparticuz/chromium/bin/al2023.tar.br").pipe(z.createBrotliDecompress()).pipe(f.createWriteStream(process.env.RUNNER_TEMP + "/m5-browser/al2023.tar"))'
          tar xf "$RUNNER_TEMP/m5-browser/al2023.tar" -C "$RUNNER_TEMP/m5-browser/libs"
          {
            echo "TMPDIR=$TMPDIR"
            echo "STUDIO_SCREENSHOT_CHROME=$chrome"
            echo "STUDIO_PUPPETEER_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
            # Compare continuity reads this variable and would otherwise drop its own
            # --no-sandbox default, which the GitHub runner needs (no unprivileged userns).
            echo "STUDIO_SCREENSHOT_CHROME_ARGS=--disable-gpu --no-sandbox"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/m5-browser/libs/lib"
            echo "STUDIO_PYTHON=python"
          } >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/m5-browser/libs/lib" "$chrome" --version
      - name: Run both walks and publish whatever they produce
        run: |
          set -uo pipefail
          mkdir -p .uiv2-evidence
          status=0

          echo "== compare continuity walk"
          if ! node scripts/compare_continuity_walk.mjs --screenshots "$RUNNER_TEMP/compare" --json > "$RUNNER_TEMP/compare.json" 2> "$RUNNER_TEMP/compare.err"; then
            echo "compare walk failed"
            status=1
            { echo "compare-walk exit non-zero"; tail -n 60 "$RUNNER_TEMP/compare.err"; echo "--- stdout tail"; tail -n 40 "$RUNNER_TEMP/compare.json"; } > .uiv2-evidence/error.txt
          else
            cp "$RUNNER_TEMP/compare.json" .uiv2-evidence/compare.json
          fi

          echo "== approved cross-tab structure walk"
          if ! node scripts/uiux_v2_cross_tab_reference_walk.mjs --check --out "$RUNNER_TEMP/visual" --timeout-ms 60000 > "$RUNNER_TEMP/visual.log" 2>&1; then
            echo "cross-tab walk failed"
            status=1
            { echo "cross-tab check exit non-zero"; tail -n 60 "$RUNNER_TEMP/visual.log"; } > .uiv2-evidence/error.txt
          elif [ -f "$RUNNER_TEMP/visual/check-manifest.json" ]; then
            cp "$RUNNER_TEMP/visual/check-manifest.json" .uiv2-evidence/check-manifest.json
            cp "$RUNNER_TEMP/visual.log" .uiv2-evidence/cross-tab-walk.log
          fi

          git config user.name "uiv2-evidence"
          git config user.email "uiv2-evidence@users.noreply.github.com"
          git add -f .uiv2-evidence
          if git diff --cached --quiet; then
            echo "nothing captured"
          else
            git commit -q -m "chore(uiv2): publish the evidence capture from ${GITHUB_SHA}" -m "Compare continuity and cross-tab check outputs from real runs on the pinned Chromium 153 build, committed where the sandbox that drives this branch can read them (artifacts and job logs are unreachable from there). Deleted before merge."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit "$status"
