[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "m5-agent-studio"
version = "9.0.1"
description = "Local-first hybrid AI studio and agent harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.28,<0.29",
  "httpcore>=1.0,<2",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14,<0.15",
  "mypy>=1.19,<2",
]
# Advisory-database tooling for `scripts/release_supply_chain.py`. Deliberately
# optional: it is never a runtime dependency of the shipped artifact.
supply-chain = [
  "pip-audit>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# studio.py is generated by scripts/build_studio.py from app.py + static/index.html;
# lint the canonical sources, not the build artifact.
extend-exclude = ["studio.py"]

[tool.mypy]
python_version = "3.11"
# Gate the typed contract modules first (clean today). app.py, scripts/, and
# tests/ join this list as the typing ratchet advances; scripts/check_*.py and
# the roadmap dashboard are covered by their own validation.
files = [
  "benchmark_publication.py",
  "capability_negotiation.py",
  "comparison_board.py",
  "context_reassembly.py",
  "context_store.py",
  "execution_budget.py",
  "failure_injection.py",
  "hardware_capabilities.py",
  "hardware_validation.py",
  "history_privacy.py",
  "local_provider_adapters.py",
  "local_runtime_lifecycle.py",
  "macos_hardware_profiler.py",
  "mcp_client.py",
  "model_calibration.py",
  "model_comparison.py",
  "model_diagnostics.py",
  "model_discovery.py",
  "model_recommendation.py",
  "model_registry.py",
  "model_switching.py",
  "model_updates.py",
  "onboarding_preflight.py",
  "performance_profiles.py",
  "release_manager.py",
  "supply_chain.py",
  "private_network_gateway.py",
  "provider_switching.py",
  "resource_admission.py",
  "routing_policy.py",
  "sandbox_boundary.py",
  "session_trust.py",
  "side_effect_ledger.py",
  "workflow_checkpoints.py",
  "workflow_evaluation.py",
  "workflow_orchestration.py",
  "workflow_state.py",
  "workflow_tracing.py",
]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.setuptools]
py-modules = ["app", "benchmark_publication", "context_store", "history_privacy", "mcp_client", "onboarding_preflight", "release_manager", "supply_chain", "workflow_orchestration", "hardware_capabilities", "macos_hardware_profiler", "model_registry", "resource_admission", "capability_negotiation", "local_runtime_lifecycle", "local_provider_adapters", "routing_policy", "model_diagnostics", "hardware_validation", "private_network_gateway", "sandbox_boundary", "session_trust", "workflow_state", "workflow_checkpoints", "side_effect_ledger", "execution_budget", "workflow_tracing", "failure_injection", "model_switching", "provider_switching", "model_discovery", "context_reassembly", "model_comparison", "model_updates", "model_calibration", "performance_profiles", "comparison_board", "model_recommendation", "workflow_evaluation"]
